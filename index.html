<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>RunFocus</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #0a0a0f;
    --surface: #131120;
    --surface-2: #1c1830;
    --line: #262138;
    --violet: #7c5cff;
    --violet-bright: #9b81ff;
    --violet-deep: #2d2350;
    --ink: #f3f1f8;
    --muted: #8f89a8;
  }

  :root.theme-light {
    --void: #f6f4fb;
    --surface: #ffffff;
    --surface-2: #f0ecfa;
    --line: #e2dcf2;
    --violet: #7c5cff;
    --violet-bright: #6a49e6;
    --violet-deep: #ece5fb;
    --ink: #1c1730;
    --muted: #7a7590;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- Top bar ---------- */
  #topbar {
    padding: 16px 20px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-shrink: 0;
  }

  #topbar .wordmark {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  #topbar .wordmark span { color: var(--violet-bright); }

  #topbar .username {
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- Screens ---------- */
  main { flex: 1; min-height: 0; position: relative; }

  .screen {
    display: none;
    height: 100%;
    flex-direction: column;
  }

  .screen.active { display: flex; }

  #trackScreen { position: relative; }

  /* ---------- Stats panel (top, like Adidas) ---------- */
  #statsPanel {
    flex-shrink: 0;
    padding: 8px 20px 18px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  #mainTimer {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  #mainTimerLabel {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  #miniStatsRow {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 18px;
  }

  .mini-stat .value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .mini-stat .label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  .running #mainTimer { color: var(--violet-bright); }

  /* ---------- Map (middle) ---------- */
  #map {
    flex: 1;
    min-height: 0;
    background: var(--void);
    position: relative;
  }

  #mapTint {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(20,14,40,0.35), rgba(10,8,20,0.55));
    mix-blend-mode: multiply;
    z-index: 400;
  }

  :root.theme-light #mapTint { display: none; }

  #locatingMsg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 0 40px;
    z-index: 401;
    pointer-events: none;
  }

  #locatingMsg.hidden { display: none; }

  /* ---------- Bottom action bar ---------- */
  #bottomBar {
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  #actionRow {
    display: flex;
    gap: 10px;
  }

  #actionRow button {
    flex: 1;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }

  #actionRow button svg { width: 18px; height: 18px; flex-shrink: 0; }

  button:active { transform: scale(0.97); }

  #startBtn {
    background: var(--violet);
    color: #fff;
    box-shadow: 0 0 0 1px rgba(124,92,255,0.4), 0 8px 24px -8px rgba(124,92,255,0.6);
  }

  #pauseBtn {
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line) !important;
    display: none;
  }

  #stopBtn {
    background: var(--surface-2);
    color: #ef4b6a;
    border: 1px solid rgba(239,75,106,0.35) !important;
    display: none;
  }

  #status {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------- Countdown overlay ---------- */
  #countdownOverlay {
    position: absolute;
    inset: 0;
    background: rgba(10,10,15,0.96);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    gap: 10px;
  }

  :root.theme-light #countdownOverlay { background: rgba(246,244,251,0.97); }

  #countdownOverlay.active { display: flex; }

  #countdownNumber {
    font-size: 96px;
    font-weight: 800;
    color: var(--violet-bright);
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  #countdownLabel {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  #countdownActions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  #skipCountdownBtn {
    background: var(--violet);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 14px;
    cursor: pointer;
  }

  #cancelCountdownBtn {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 14px;
    cursor: pointer;
  }

  /* ---------- History screen ---------- */
  #historyScreen { overflow-y: auto; padding: 4px 20px calc(16px + env(safe-area-inset-bottom)); }

  #historySummary {
    display: flex;
    gap: 22px;
    padding: 6px 4px 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 6px;
  }

  #historySummary .value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  #historySummary .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .run-card {
    border: 1px solid var(--line);
    border-radius: 18px;
    margin: 14px 0;
    overflow: hidden;
    background: var(--surface);
  }

  .run-card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 18px 4px;
  }

  .run-card-type {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--violet-bright);
  }

  .run-card-date {
    font-size: 12px;
    color: var(--muted);
  }

  .run-card-stats {
    display: flex;
    gap: 24px;
    padding: 10px 18px 16px;
  }

  .run-card-stats .value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .run-card-stats .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-top: 3px;
  }

  .run-card-map {
    width: 100%;
    height: 150px;
    background: var(--surface-2);
    display: block;
  }

  .run-card-map .leaflet-control-attribution { display: none; }

  .run-card-footer {
    display: flex;
    justify-content: flex-end;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
  }

  .share-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 10px;
    cursor: pointer;
  }

  .share-btn svg { width: 16px; height: 16px; }
  .share-btn:active { color: var(--violet-bright); }

  #emptyHistory {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ---------- Settings screen ---------- */
  #settingsScreen { overflow-y: auto; padding: 8px 20px calc(16px + env(safe-area-inset-bottom)); }

  .settings-group { margin-bottom: 28px; }

  .settings-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .option-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .option-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: 12px;
    cursor: pointer;
  }

  .option-btn.active {
    background: var(--violet);
    border-color: var(--violet);
    color: #fff;
  }

  /* ---------- Bottom nav ---------- */
  #bottomNav {
    display: flex;
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    background: var(--void);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .navBtn {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 0 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  .navBtn svg { width: 22px; height: 22px; }
  .navBtn.active { color: var(--violet-bright); }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="wordmark">Run<span>Focus</span></div>
    <div class="username" id="username">—</div>
  </div>

  <main>
    <section id="trackScreen" class="screen active">
      <div id="statsPanel">
        <div id="mainTimer">00:00</div>
        <div id="mainTimerLabel" data-i18n="statTimeLabel">time</div>
        <div id="miniStatsRow">
          <div class="mini-stat">
            <div class="value" id="statDistance">0.00</div>
            <div class="label" data-i18n="statDistanceLabel">km</div>
          </div>
          <div class="mini-stat">
            <div class="value" id="statPace">—:—</div>
            <div class="label" data-i18n="statPaceLabel">pace /km</div>
          </div>
        </div>
      </div>
      <div id="map"></div>
      <div id="mapTint"></div>
      <div id="locatingMsg" data-i18n="locatingMsg">Locating you…</div>
      <div id="countdownOverlay">
        <div id="countdownNumber">15</div>
        <div id="countdownLabel" data-i18n="countdownLabel">Get ready</div>
        <div id="countdownActions">
          <button id="skipCountdownBtn" data-i18n="skipBtn">Start now</button>
          <button id="cancelCountdownBtn" data-i18n="cancelBtn">Cancel</button>
        </div>
      </div>
      <div id="bottomBar">
        <div id="actionRow">
          <button id="startBtn">
            <span data-i18n="startBtn">Start run</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
          <button id="pauseBtn">
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            <span id="pauseBtnText" data-i18n="pauseBtn">Pause</span>
          </button>
          <button id="stopBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
            <span data-i18n="stopBtn">Finish</span>
          </button>
        </div>
        <div id="status"></div>
      </div>
    </section>

    <section id="historyScreen" class="screen">
      <div id="historySummary">
        <div>
          <div class="value" id="totalRuns">0</div>
          <div class="label" data-i18n="totalRunsLabel">runs</div>
        </div>
        <div>
          <div class="value" id="totalDistance">0</div>
          <div class="label" data-i18n="totalDistanceLabel">km total</div>
        </div>
      </div>
      <div id="historyList"></div>
    </section>

    <section id="settingsScreen" class="screen">
      <div class="settings-group">
        <div class="settings-label" data-i18n="languageLabel">Language</div>
        <div class="option-row" id="langOptions">
          <button class="option-btn" data-lang="en">English</button>
          <button class="option-btn" data-lang="ru">Русский</button>
          <button class="option-btn" data-lang="uk">Українська</button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label" data-i18n="themeLabel">Theme</div>
        <div class="option-row" id="themeOptions">
          <button class="option-btn" data-theme="dark" data-i18n="themeDark">Dark</button>
          <button class="option-btn" data-theme="light" data-i18n="themeLight">Light</button>
        </div>
      </div>
    </section>
  </main>

  <nav id="bottomNav">
    <button class="navBtn active" data-screen="trackScreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
      <span data-i18n="navTrack">Tracker</span>
    </button>
    <button class="navBtn" data-screen="historyScreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      <span data-i18n="navHistory">History</span>
    </button>
    <button class="navBtn" data-screen="settingsScreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="navSettings">Settings</span>
    </button>
  </nav>
</div>

<script src="app.js?v=9"></script>
</body>
</html>
